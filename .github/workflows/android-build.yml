name: Build Android App

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Signing Keystore & Prepare Permissions
        run: |
          chmod +x gradlew
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating permanent keystore from embedded signature..."
            echo "" | base64 -d > debug.keystore
          fi
          ls -lh debug.keystore

      - name: Build Application APK
        run: |
          ./gradlew assembleDebug --no-daemon --warning-mode=none

      - name: Collect Output APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -lh output_apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dantotsu-App-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
